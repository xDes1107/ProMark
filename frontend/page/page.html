<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Search</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f4f6f8;
			color: #1f2937;
			font-family: system-ui, sans-serif;
		}
		main { width: min(100%, 560px); text-align: center; }
		h1 { margin: 0 0 24px; font-size: 2rem; }
		form {
			display: flex;
			gap: 10px;
			padding: 8px;
			background: #fff;
			border: 1px solid #d1d5db;
			border-radius: 12px;
			box-shadow: 0 4px 16px rgb(31 41 55 / 8%);
		}
		input {
			flex: 1;
			min-width: 0;
			padding: 12px;
			border: 0;
			outline: 0;
			font: inherit;
		}
		button {
			padding: 12px 20px;
			border: 0;
			border-radius: 8px;
			background: #2563eb;
			color: #fff;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
		#search-status { min-height: 1.5em; margin: 20px 0 12px; }
		#results {
			display: grid;
			gap: 12px;
			margin: 0;
			padding: 0;
			list-style: none;
			text-align: left;
		}
		.result {
			padding: 16px;
			background: #fff;
			border: 1px solid #d1d5db;
			border-radius: 10px;
		}
		.result h2 { margin: 0 0 6px; font-size: 1.125rem; }
		.result p { margin: 4px 0; color: #4b5563; }
	</style>
</head>
<body>
	<main>
		<h1>What are you looking for?</h1>
		<form id="search-form" action="http://localhost:3000/professionals" method="get" role="search">
			<input type="search" name="q" placeholder="Search..." aria-label="Search" required>
			<button type="submit">Search</button>
		</form>
		<p id="search-status" role="status" aria-live="polite"></p>
		<ul id="results" aria-label="Search results"></ul>
	</main>
	<script>
		const form = document.querySelector("#search-form");
		const input = form.querySelector('input[name="q"]');
		const submitButton = form.querySelector('button[type="submit"]');
		const status = document.querySelector("#search-status");
		const results = document.querySelector("#results");

		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			const query = input.value.trim();
			results.replaceChildren();

			if (!query) {
				status.textContent = "Enter a name, trade, company, or location to search.";
				return;
			}

			status.textContent = "Searching...";
			submitButton.disabled = true;

			try {
				const endpoint = new URL(form.action);
				endpoint.searchParams.set("q", query);

				const response = await fetch(endpoint);
				if (!response.ok) {
					throw new Error(`Search failed (${response.status}).`);
				}

				const professionals = await response.json();
				if (!Array.isArray(professionals)) {
					throw new Error("The search API returned an unexpected response.");
				}

				if (professionals.length === 0) {
					status.textContent = "No professionals matched your search.";
					return;
				}

				status.textContent = `${professionals.length} professional${professionals.length === 1 ? "" : "s"} found.`;

				for (const professional of professionals) {
					const item = document.createElement("li");
					item.className = "result";

					const name = document.createElement("h2");
					name.textContent = professional.name;
					item.append(name);

					const details = [professional.trade, professional.company, professional.location]
						.filter(Boolean);
					for (const detail of details) {
						const paragraph = document.createElement("p");
						paragraph.textContent = detail;
						item.append(paragraph);
					}

					results.append(item);
				}
			} catch (error) {
				console.error("Professional search failed:", error);
				status.textContent = error instanceof Error
					? `${error.message} Check that the API is running and allows this page's origin.`
					: "Search failed. Check that the API is running and allows this page's origin.";
			} finally {
				submitButton.disabled = false;
			}
		});
	</script>
</body>
</html>
